<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Image Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <input type="file" id="pdfInput" accept="application/pdf" />
    <button id="convertBtn">Convert & Download ZIP</button>
    <div id="status"></div>

    <script>
        // ตั้งค่า Worker ของ PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        document.getElementById('convertBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('pdfInput');
            if (fileInput.files.length === 0) return alert('กรุณาเลือกไฟล์ PDF ก่อนครับ');

            const file = fileInput.files[0];
            const fileReader = new FileReader();

            document.getElementById('status').innerText = 'กำลังประมวลผล...';

            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                
                const zip = new JSZip();

                // วนลูปตามจำนวนหน้าของ PDF
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    // 🎯 ทริคความชัดอยู่ตรงนี้: ปรับ scale ให้สูงขึ้น (เช่น 2.0 หรือ 3.0 สำหรับ 2K/4K)
                    const scale = 3.0; 
                    const viewport = page.getViewport({ scale: scale });

                    // สร้าง Canvas เพื่อวาดหน้า PDF
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    // รอให้เรนเดอร์เสร็จ
                    await page.render(renderContext).promise;

                    // แปลง Canvas เป็น Base64 Image (ตั้งเป็น PNG เพื่อความคมชัด)
                    const imgData = canvas.toDataURL('image/png').split(',')[1];
                    
                    // นำรูปใส่ในไฟล์ Zip
                    zip.file(`page_${pageNum}.png`, imgData, {base64: true});
                    
                    document.getElementById('status').innerText = `กำลังแปลงหน้า ${pageNum} / ${pdf.numPages}...`;
                }

                // สร้างไฟล์ Zip และสั่งดาวน์โหลด
                document.getElementById('status').innerText = 'กำลังสร้างไฟล์ ZIP...';
                const content = await zip.generateAsync({type: "blob"});
                saveAs(content, "pdf_images.zip");
                
                document.getElementById('status').innerText = 'ดาวน์โหลดสำเร็จ!';
            };

            fileReader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
